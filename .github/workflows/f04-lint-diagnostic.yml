name: F04 Lint Diagnostic

on:
  push:
    branches:
      - agent/f04-widgets-inspector-themes

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lint-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture lint output
        run: |
          set +e
          npm run lint > lint.log 2>&1
          status=$?
          echo "Lint exit code: $status" >> lint.log
          exit 0

      - name: Publish diagnostic to PR 5
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('lint.log', 'utf8').slice(-12000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 5,
              body: `<!-- f04-lint-diagnostic -->\n\`\`\`text\n${output}\n\`\`\``
            });
