name: Bootstrap Tailwind Lockfile

on:
  push:
    branches: [ui/production-studio]
    paths:
      - package.json
      - vite.config.ts
      - .github/workflows/tailwind-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[tailwind-lock]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/production-studio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: sync Tailwind lockfile [tailwind-lock]"
          git push origin HEAD:ui/production-studio
